# CI: lint and test both halves of the project.
#
# The trained models are gitignored - they are build outputs, and the raw data
# they need is 9.5 GB of point cloud. The backend suite is written to skip the
# tests that need artefacts rather than fail without them, so CI exercises
# everything else and reports honestly how much it covered.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # No geo or hecras extras: GDAL is heavy and HEC-RAS is Windows-only.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,api,dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm run test

  containers:
    name: Container builds and runtime
    runs-on: ubuntu-latest
    # Docker is not installed on the development machine, so this job is the
    # only place the images are built and run. It is the check that the
    # invariants in tests/test_deployment.py cannot make on their own: those
    # read the Dockerfiles, this runs what they produce.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the API image
        run: docker build -t aquanexus-api:ci .

      - name: Build the frontend image
        run: docker build -t aquanexus-frontend:ci ./frontend

      - name: Run both containers and check them
        # CI has no trained models - they are build outputs of 9.5 GB of point
        # cloud and a Windows-only HEC-RAS run - so the script has the API image
        # fabricate a stand-in set first. That is what lets the smoke suite run
        # against a loaded service rather than a degraded one; every number in
        # it is meaningless and labelled as such.
        run: |
          python -m pip install httpx
          bash scripts/check_containers.sh aquanexus-api:ci aquanexus-frontend:ci
