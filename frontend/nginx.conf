server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames change on every build, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: /predict and /analyze are routes, not files. Without
    # this fallback a reload on any page but "/" returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
