[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquanexus"
version = "0.1.0"
description = "Physics-informed ML framework for aquatic ecosystem diagnosis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "kiruthick01" }]
keywords = ["hydraulics", "hec-ras", "machine-learning", "habitat-suitability", "shap"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
]
geo = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "rasterio>=1.3",
    "laspy[lazrs]>=2.5",
    "pyproj>=3.6",
    "mapbox-vector-tile>=2.1",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]
dashboard = ["streamlit>=1.36"]
# Windows only: drives HEC-RAS through its COM automation server.
hecras = ["pywin32>=306; sys_platform == 'win32'"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "jupyter>=1.0",
]

[project.urls]
Repository = "https://github.com/kiruthick01/aquanexus"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aquanexus.hecras" = ["templates/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
