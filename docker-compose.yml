services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_DEBUG: "true"
      LOG_LEVEL: DEBUG
      # The image installs the package into site-packages (a non-editable
      # `pip install .`), so mounting ./src alone would change nothing: the
      # import would still resolve to the copy baked into the image, and
      # --reload would restart on edits that could not take effect. PYTHONPATH
      # puts the mounted source ahead of site-packages so the mount is real.
      PYTHONPATH: /app/src
    volumes:
      # Source is mounted for reload; data is mounted so the container reads
      # the same HEC-RAS outputs and trained models the host produced. Without
      # the data mount the API starts degraded - no models are copied into the
      # image, by design, since they are build outputs rather than source.
      - ./src:/app/src:ro
      - ./data:/app/data
    command: >
      uvicorn aquanexus.api.app:app
      --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src

  frontend:
    build: ./frontend
    environment:
      # Read at container start, not baked into the bundle, so this image can be
      # repointed without rebuilding. The browser resolves it, so it must be an
      # address the *host* can reach: http://api:8000 would only work from
      # inside the compose network.
      API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api
